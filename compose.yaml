# compose.yaml
services:
  app:
    container_name: app-approov
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HOST_PORT:-8080}:8080"   # host:container
    volumes:
      - ./:/workspace
      - gradle-cache:/workspace/.gradle
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gradle-cache:
