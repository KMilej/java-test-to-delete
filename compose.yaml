# compose.yaml
services:
  app:
    container_name: java-spring
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HOST_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      - ./:/workspace
      - gradle-cache:/workspace/.gradle
    env_file:
      - .env

volumes:
  gradle-cache:
